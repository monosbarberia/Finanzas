<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c3823">
<title>Mono's · Caja</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<link rel="apple-touch-icon" href="favicon.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1c3823;--o:#cbb26a;--oh:#e0cca0;--soft:rgba(203,178,106,.06);--line:rgba(203,178,106,.28);--bad:#e9a79d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--g);color:var(--o);font-family:'Cormorant Garamond',serif;font-size:18px}
body{min-height:100vh;overflow-x:hidden;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:550px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{height:46px;width:auto;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.login .logo{height:120px;margin:0 auto 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:2px;font-size:1.15em;text-transform:uppercase}
.tools{display:flex;gap:8px}
button{font-family:inherit;color:var(--o);cursor:pointer}
.ico{background:rgba(203,178,106,.12);border:1px solid var(--line);border-radius:6px;width:42px;height:42px;font-size:1.2em;transition:transform .12s,background .2s}
.spin{animation:sp .7s linear}
@keyframes sp{to{transform:rotate(360deg)}}
.box{background:var(--soft);border:1px solid rgba(203,178,106,.2);border-radius:8px;padding:22px 18px;margin-bottom:16px;box-shadow:0 15px 40px rgba(0,0,0,.35)}
.hero{text-align:center;padding:26px 14px 22px}
.hlab{font-size:1.05em;font-style:italic;opacity:.8}
.nav{display:flex;align-items:center;justify-content:center;gap:14px}
.nav button{background:none;border:0;font-size:1.8em;padding:4px 10px;transition:transform .12s}
.nav button:disabled{opacity:.2}
.big{font-size:clamp(2.8em,15vw,4.6em);font-weight:700;line-height:1;margin:6px 0 14px;color:#fff;letter-spacing:1px}
.pill{background:transparent;border:1px solid var(--o);border-radius:20px;padding:7px 16px;font-size:.9em;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:all .15s}
.pill.ok{background:var(--o);color:var(--g)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.card{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:8px;padding:14px;transition:transform .12s;position:relative}
.card small{display:block;font-style:italic;opacity:.75}
.card b{font-size:1.7em;color:#fff}
.card .cp{position:absolute;top:8px;right:8px;background:none;border:0;font-size:1.05em;padding:6px;opacity:.8}
.btn{background:var(--o);color:var(--g);border:0;border-radius:6px;padding:17px;width:100%;font-size:1.3em;font-weight:700;letter-spacing:1px;text-transform:uppercase;box-shadow:0 5px 0 #8f7c42,0 10px 18px rgba(0,0,0,.35);transition:transform .1s,box-shadow .1s;margin-bottom:22px}
.btn.sm{font-size:1.1em;padding:13px;margin:0}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--o);border:1px solid var(--o);box-shadow:none}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:6px;padding:10px 4px;font-size:1em;font-weight:600;transition:all .15s}
.seg button.on{background:var(--o);color:var(--g);border-color:var(--o)}
.sum{font-style:italic;opacity:.8;font-size:.95em;margin:2px 2px 10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 4px;border-bottom:1px solid rgba(203,178,106,.14);cursor:pointer;transition:transform .12s,background .2s}
.row:last-child{border:0}
.row b{font-size:1.1em}.row small{display:block;opacity:.7;font-size:.88em}
.amt{text-align:right;font-weight:700;color:#fff;font-size:1.15em;white-space:nowrap}
.amt small{font-weight:400;color:var(--o)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:.8em;margin-left:4px}
.debt{color:var(--bad);border-color:var(--bad)}
.empty{text-align:center;opacity:.6;font-style:italic;padding:22px 0}
input,select{width:100%;background:rgba(0,0,0,.25);color:var(--o);border:1px solid rgba(203,178,106,.5);border-radius:6px;padding:15px;font-family:inherit;font-size:1.15em;outline:none;margin-bottom:12px;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--o)}
input::placeholder{color:rgba(203,178,106,.45)}
input[type=date]{min-height:54px}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(75%) sepia(40%) saturate(400%) hue-rotate(5deg)}
label.l{display:block;font-style:italic;opacity:.8;font-size:.95em;margin:0 0 4px 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:1em;transition:all .15s}
.chip.on{background:var(--o);color:var(--g);font-weight:700;border-color:var(--o)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 16px}
.slot{padding:14px 4px;text-align:center;line-height:1.1}
.slot small{display:block;font-size:.7em;opacity:.8;margin-top:3px}
.slot.booked{opacity:.4;border-style:dashed}
.slot.blk{border-color:var(--bad);color:var(--bad)}
.slot.blk.on{background:var(--bad);color:var(--g);border-color:var(--bad)}
.dif{min-height:26px;text-align:center;font-style:italic;margin-bottom:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(20,45,25,.97);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);z-index:50}
.tabs button{flex:1;background:none;border:0;border-radius:6px;padding:11px 0;font-size:1em;letter-spacing:.4px;opacity:.6;transition:all .15s}
.tabs button.on{opacity:1;background:rgba(203,178,106,.16);font-weight:700}
.view{display:none}.view.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;justify-content:center;animation:fd .2s}
.ov.on{display:flex}
@keyframes fd{from{opacity:0}to{opacity:1}}
.sheet{background:#1c3823;border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:550px;max-height:92vh;overflow-y:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sh h3{margin:0;font-size:1.4em;text-transform:uppercase;letter-spacing:1px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stats div{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:6px;padding:10px 6px;text-align:center}
.stats b{display:block;color:#fff;font-size:1.2em}.stats small{font-style:italic;opacity:.75;font-size:.85em}
.alert{border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:12px;margin-bottom:14px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--o);color:var(--g);padding:11px 20px;border-radius:24px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:300}
.toast.on{opacity:1;transform:translate(-50%,0)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .box{width:100%;max-width:420px}
.login h1{text-align:center;text-transform:uppercase;letter-spacing:3px;font-size:1.7em;margin:0 0 4px}
.login p{text-align:center;font-style:italic;opacity:.7;margin:0 0 22px}
.rem{display:flex;gap:10px;align-items:center;margin:2px 0 18px;font-weight:600;cursor:pointer}
.rem input{width:26px;height:26px;margin:0;padding:0;flex-shrink:0;border:1.5px solid var(--o);border-radius:6px;background:rgba(0,0,0,.25);cursor:pointer;transition:all .15s}
.rem input:checked{background:var(--o) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5' fill='none' stroke='%231c3823' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/75% no-repeat}
.rem small{display:block;font-weight:400;font-style:italic;opacity:.7;font-size:.85em;margin-top:2px}
.err{color:var(--bad);text-align:center;min-height:22px;margin-bottom:8px}
[hidden]{display:none!important}

/* sub-cifras: sin propina / propina */
.subs{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px;font-style:italic;font-size:.9em}
.hero .subs{justify-content:center;margin-top:18px}
.subs b{font-style:normal;font-weight:600;font-size:1em;color:#f3ead0}
.subs span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.subs span::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid rgba(243,234,208,.7)}
.subs .pr,.subs .pr b{color:var(--o)}
.subs .pr::before{background:var(--o);border-color:var(--o)}
/* inventario */
.inv{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid rgba(203,178,106,.14)}
.inv:last-child{border:0}
.inf{flex:1;min-width:0;background:none;border:0;text-align:left;padding:6px 4px;border-radius:6px;font-size:1em}
.inf b{display:block;font-size:1.12em}.inf small{display:block;opacity:.7;font-size:.88em;margin-top:1px}
.stk{display:flex;align-items:center;gap:4px}
.mini{width:44px;height:44px;border-radius:50%;background:rgba(203,178,106,.12);border:1px solid var(--line);font-size:1.5em;line-height:1;padding:0}
.n{min-width:40px;text-align:center;font-weight:700;color:#fff;font-size:1.4em}
.inv.low .n{color:var(--bad)}
.bdg{position:absolute;top:1px;right:calc(50% - 38px);min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--bad);color:var(--g);font-style:normal;font-weight:700;font-size:.72em;line-height:18px;text-align:center}
/* animación de botones: hundir y rebotar con suavidad (~660 ms) */
.press{position:relative;overflow:hidden;--sy:4px;--ss:.955;--so:1.018;transition:transform .16s cubic-bezier(.3,.7,.4,1),box-shadow .16s,filter .16s,background .2s,opacity .2s,color .15s,border-color .15s}
.row,.card,.inf{--sy:2px;--ss:.975;--so:1.006}
.btn{--ss:.975;--so:1.012}
.press.down{transform:translateY(var(--sy)) scale(var(--ss));filter:brightness(.92)}
.press.tap{animation:tap .66s ease-in-out}
.press.spring{animation:spring .66s ease-in-out}
@keyframes tap{0%{transform:none}16%{transform:translateY(var(--sy)) scale(var(--ss))}48%{transform:translateY(-1.5px) scale(var(--so))}70%{transform:translateY(.5px) scale(.997)}100%{transform:none}}
@keyframes spring{0%{transform:translateY(var(--sy)) scale(var(--ss))}40%{transform:translateY(-1.5px) scale(var(--so))}68%{transform:translateY(.5px) scale(.997)}100%{transform:none}}
.btn.down{box-shadow:0 1px 0 #8f7c42,0 3px 6px rgba(0,0,0,.35)}
.btn.tap{animation-name:btnTap}.btn.spring{animation-name:btnSpring}
.btn.ghost.down{box-shadow:none}.btn.ghost.tap{animation-name:tap}.btn.ghost.spring{animation-name:spring}
@keyframes btnTap{0%{transform:none;box-shadow:0 5px 0 #8f7c42,0 10px 18px rgba(0,0,0,.35)}16%{transform:translateY(4px) scale(.975);box-shadow:0 1px 0 #8f7c42,0 3px 6px rgba(0,0,0,.35)}48%{transform:translateY(-2px) scale(1.012);box-shadow:0 7px 0 #8f7c42,0 13px 20px rgba(0,0,0,.35)}70%{transform:translateY(.5px) scale(.997);box-shadow:0 4.5px 0 #8f7c42,0 9px 16px rgba(0,0,0,.35)}100%{transform:none;box-shadow:0 5px 0 #8f7c42,0 10px 18px rgba(0,0,0,.35)}}
@keyframes btnSpring{0%{transform:translateY(4px) scale(.975);box-shadow:0 1px 0 #8f7c42,0 3px 6px rgba(0,0,0,.35)}40%{transform:translateY(-2px) scale(1.012);box-shadow:0 7px 0 #8f7c42,0 13px 20px rgba(0,0,0,.35)}68%{transform:translateY(.5px) scale(.997);box-shadow:0 4.5px 0 #8f7c42,0 9px 16px rgba(0,0,0,.35)}100%{transform:none;box-shadow:0 5px 0 #8f7c42,0 10px 18px rgba(0,0,0,.35)}}
.rip{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle,rgba(255,246,214,.5),rgba(255,246,214,0) 70%);transform:scale(0);pointer-events:none;animation:rip .66s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rip{0%{transform:scale(0);opacity:1}100%{transform:scale(var(--s,12));opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="loginV" class="login" hidden>
  <div class="box">
    <img class="logo" src="logo.png" alt="Mono's" onerror="this.style.display='none'"><p>Caja y turnos</p>
    <input id="lEm" type="email" placeholder="Correo" autocomplete="username">
    <input id="lPw" type="password" placeholder="Contraseña" autocomplete="current-password">
    <label class="rem"><input type="checkbox" id="lRem" checked><span>Mantener sesión iniciada<small id="lHint"></small></span></label>
    <div class="err" id="lErr"></div>
    <button class="btn" style="margin:0" id="lBtn" onclick="login()">Entrar</button>
  </div>
</div>

<div id="app" hidden>
<div class="wrap">
  <div class="top">
    <div class="brand"><img class="logo" src="logo.png" alt="Mono's" onerror="this.style.display='none'"></div>
    <div class="tools">
      <button class="ico" id="rf" onclick="recargar(true)" aria-label="Actualizar"><span id="rfi" style="display:inline-block">&#8635;</span></button>
      <button class="ico" onclick="salir()" aria-label="Cerrar sesión">&#10162;</button>
    </div>
  </div>

  <section class="view on" id="v-caja">
    <div class="box hero">
      <div class="nav">
        <button onclick="moverDia(-1)" aria-label="Día anterior">&#8249;</button>
        <div class="hlab" id="hLab"></div>
        <button id="nx" onclick="moverDia(1)" aria-label="Día siguiente">&#8250;</button>
      </div>
      <div class="big" id="hBig">$0</div>
      <button class="pill" onclick="copiar(S.vd,this)">Copiar</button>
      <div class="subs" id="hSub"></div>
    </div>
    <div class="grid2">
      <div class="card"><button class="cp" onclick="copiar(S.vw,this)" aria-label="Copiar semana">&#10064;</button><small>Semana</small><b id="cW">$0</b><div class="subs" id="cW0"></div></div>
      <div class="card"><button class="cp" onclick="copiar(S.vm,this)" aria-label="Copiar mes">&#10064;</button><small>Mes</small><b id="cM">$0</b><div class="subs" id="cM0"></div></div>
    </div>
    <button class="btn" onclick="later(abrirIngreso)">+ Ingresar ganancia</button>
    <div class="box">
      <div class="seg" id="perSeg">
        <button data-p="dia" class="on">Día</button><button data-p="sem">Semana</button><button data-p="mes">Mes</button>
      </div>
      <div class="sum" id="perSum"></div>
      <div id="lista"></div>
    </div>
  </section>

  <section class="view" id="v-cli">
    <div class="box">
      <input id="cBus" type="text" placeholder="Buscar cliente" oninput="pintaCli()">
      <div class="seg" id="cliSeg"><button data-f="todos" class="on">Todos</button><button data-f="deben">Deben turno</button></div>
      <div id="cliLista"></div>
    </div>
  </section>

  <section class="view" id="v-inv">
    <div id="invAlert"></div>
    <button class="btn" onclick="later(()=>editInv())">+ Añadir producto</button>
    <div class="box"><div id="invLista"></div></div>
  </section>

  <section class="view" id="v-blq">
    <div class="box">
      <label class="l">Día</label>
      <input type="date" id="bFec" onchange="S.bdia=this.value;cargarBloq()">
      <div id="bMsg"></div>
      <div class="slots" id="slots"></div>
      <div class="grid2" style="margin:0 0 12px">
        <button class="btn sm" onclick="bloquear(false)" id="bBl">Bloquear</button>
        <button class="btn sm ghost" onclick="liberar()" id="bLi">Liberar</button>
      </div>
      <button class="btn sm ghost" onclick="bloquear(true)">Bloquear día completo</button>
    </div>
    <div class="box"><h3 style="margin:0 0 8px;font-size:1.2em;text-transform:uppercase;letter-spacing:1px">Próximos bloqueos</h3><div id="bProx"></div></div>
  </section>
</div>

<nav class="tabs">
  <button class="on" data-v="caja">Caja</button>
  <button data-v="cli">Clientes</button>
  <button data-v="inv">Inventario<i class="bdg" id="invBdg" hidden></i></button>
  <button data-v="blq">Bloqueos</button>
</nav>
</div>

<div class="ov" id="ov" onclick="if(event.target===this)cerrar()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://ldxxflhwpyzldisydhmd.supabase.co";
const SB_KEY="sb_publishable_zYVUWmP8r6s21WegS23RxQ_G-MOf1TH";
const TZ="America/Havana";
const DESDE="2026-10-23";
const SLOTS=["9:00 AM","9:30 AM","10:00 AM","10:30 AM","11:00 AM","11:30 AM","2:00 PM","2:30 PM","3:00 PM","3:30 PM","4:00 PM"];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoy=()=>new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(new Date());
const hms=()=>new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date()).replace(/:/g,"");
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const lunes=s=>addDays(s,-((new Date(s+"T00:00:00Z").getUTCDay()+6)%7));
const bonita=s=>new Intl.DateTimeFormat("es",{timeZone:"UTC",weekday:"short",day:"numeric",month:"short"}).format(new Date(s+"T00:00:00Z"));
const fmt=n=>"$"+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};

let sb=null;
const S={dia:hoy(),per:"dia",cobros:[],cli:new Map(),precios:[],bdia:hoy(),bd:[],bsel:new Set(),filtro:"todos",vd:0,vw:0,vm:0,vis:0,vd0:0,vis0:0,vw0:0,vm0:0};

const SKEY="sb-"+SB_URL.split("//")[1].split(".")[0]+"-auth-token";
// persist=true: la sesión se guarda en el teléfono. persist=false: solo vive en memoria y al refrescar vuelve el login.
function mk(persist){return window.supabase.createClient(SB_URL,SB_KEY,{auth:persist?{storage:localStorage,persistSession:true,autoRefreshToken:true}:{persistSession:false,autoRefreshToken:true}})}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}

function hintRem(){$("#lHint").textContent=$("#lRem").checked?"Se mantendrá abierta en este teléfono":"Al refrescar o cerrar, pedirá la contraseña"}
$("#lRem").onchange=hintRem;hintRem();
async function init(){
  try{sessionStorage.removeItem(SKEY)}catch(e){}
  let guardada=false;
  try{guardada=!!localStorage.getItem(SKEY)}catch(e){}
  if(guardada){try{const c=mk(true);const {data}=await c.auth.getSession();if(data.session){sb=c;return entrar()}}catch(e){}}
  $("#loginV").hidden=false;
}
async function login(){
  const em=$("#lEm").value.trim(),pw=$("#lPw").value;
  if(!em||!pw){$("#lErr").textContent="Escribe correo y contraseña";return}
  const b=$("#lBtn");b.disabled=true;b.textContent="Entrando...";$("#lErr").textContent="";
  try{
    const rec=$("#lRem").checked;
    if(!rec){try{localStorage.removeItem(SKEY)}catch(e){}}
    const c=mk(rec);
    const {error}=await c.auth.signInWithPassword({email:em,password:pw});
    if(error)throw error;
    sb=c;entrar();
  }catch(e){$("#lErr").textContent="Correo o contraseña incorrectos"}
  b.disabled=false;b.textContent="Entrar";
}

async function traerTodo(){
  let all=[],from=0;
  for(;;){
    const {data,error}=await sb.from("turnos")
      .select("id,fecha,turno,nombre,telefono,reserva_id,servicios,total,precio_esperado,precio_cobrado,propina,descuento,no_show,no_show_cobrado")
      .gte("fecha",DESDE).or("precio_cobrado.not.is.null,no_show.eq.true").order("id").range(from,from+999);
    if(error)throw error;
    all=all.concat(data);if(data.length<1000)break;from+=1000;
  }
  return all;
}
const keyCli=(tel,nom)=>tel&&tel.trim()?tel.trim():"n:"+String(nom||"").toLowerCase().trim();

function construir(rows){
  const m=new Map();
  rows.forEach(r=>{
    const k=r.reserva_id||("id"+r.id);let g=m.get(k);
    if(!g){g={k,id:r.id,fecha:r.fecha,nombre:r.nombre,tel:r.telefono,serv:r.servicios,esp:0,cob:null,prop:0,desc:0,ns:false,nsc:false};m.set(k,g)}
    if(r.precio_cobrado!=null)g.cob=Math.max(g.cob??0,+r.precio_cobrado);
    g.esp=Math.max(g.esp,+(r.precio_esperado??r.total??0));
    g.prop=Math.max(g.prop,+(r.propina||0));g.desc=Math.max(g.desc,+(r.descuento||0));
    if(r.no_show)g.ns=true;if(r.no_show_cobrado)g.nsc=true;
    if(r.fecha<g.fecha)g.fecha=r.fecha;
  });
  const res=[...m.values()];
  res.forEach(g=>{
    g.key=keyCli(g.tel,g.nombre);
    if(g.cob!=null){
      // precio del servicio ya con descuento
      const base=g.esp>0?Math.max(g.esp-g.desc,0):null;
      // propina que ya viene dentro de lo cobrado (cobrado por encima del precio)
      const incl=base==null?g.prop:Math.max(g.cob-base,0);
      g.prop=Math.max(g.prop,incl);
      // si la propina NO venía dentro de lo cobrado, se suma; si ya venía, no se cuenta dos veces
      g.con=base==null?g.cob:g.cob+Math.max(g.prop-incl,0);
      g.sin=Math.max(g.con-g.prop,0);
    }
  });
  return res;
}

async function recargar(manual){
  const rf=$("#rfi");rf.classList.remove("spin");void rf.offsetWidth;rf.classList.add("spin");
  try{
    const res=construir(await traerTodo());
    S.cobros=res.filter(g=>g.cob!=null);
    const cm=new Map();
    res.sort((a,b)=>b.fecha<a.fecha?-1:b.fecha>a.fecha?1:0).forEach(g=>{
      if(g.nombre==="Ingreso extra")return;
      let c=cm.get(g.key);
      if(!c){c=cm.set(g.key,{key:g.key,nombre:g.nombre,tel:g.tel,items:[],total:0,vis:0,prop:0,desc:0,ns:0,deuda:0,nDeuda:0}).get(g.key)}
      c.items.push(g);
      if(g.cob!=null){c.total+=g.con;c.vis++;c.prop+=g.prop;c.desc+=g.desc}
      if(g.ns){c.ns++;if(!g.nsc){c.nDeuda++;c.deuda+=g.esp}}
    });
    S.cli=cm;
    pintaCaja();pintaCli();
    try{await cargarInv()}catch(e){}
    if(manual)toast("Actualizado");
  }catch(e){toast("No se pudo cargar. Revisa la conexión")}
}

  abrir(`<div class="sh"><h3>${p?"Editar producto":"Nuevo producto"}</h3><button class="ico" onclick="cerrar()">&#10005;</button></div>
  <input id="pNom" placeholder="Nombre del producto" maxlength="60" value="${p?esc(p.nombre):""}">
  <label class="l">Stock actual</label><input id="pSt" type="number" inputmode="decimal" placeholder="0" value="${p?nn(p.stock_actual):""}">
  <label class="l">Avisarme cuando llegue a (mínimo)</label><input id="pMin" type="number" inputmode="decimal" placeholder="0" value="${p?nn(p.stock_minimo):""}">
  <label class="l">Unidad</label><input id="pUni" placeholder="unidad, frasco, caja..." maxlength="20" value="${p?esc(p.unidad||"unidad"):"unidad"}">
  <button class="btn" style="margin-bottom:0" id="pOk" onclick="guardarInv(${p?p.id:"null"})">Guardar</button>
  ${p?`<button class="btn ghost sm" style="margin-top:14px" onclick="borrarInv(${p.id})">Eliminar producto</button>`:""}`);
}
async function guardarInv(id){
  const nombre=$("#pNom").value.trim(),st=num($("#pSt").value),mn=num($("#pMin").value),un=$("#pUni").value.trim()||"unidad";
  if(!nombre)return toast("Escribe el nombre");
  if(st<0||mn<0)return toast("Los números no pueden ser negativos");
  const row={nombre,stock_actual:st,stock_minimo:mn,unidad:un};
  const b=$("#pOk");b.disabled=true;
  const {error}=id?await sb.from("inventario").update(row).eq("id",id):await sb.from("inventario").insert({...row,activo:true});
  b.disabled=false;
  if(error)return toast("No se pudo guardar");
  cerrar();toast(id?"Guardado":"Producto añadido");
  try{await cargarInv()}catch(e){}
}
async function borrarInv(id){
  if(!confirm("¿Eliminar este producto del inventario?"))return;
  const {error}=await sb.from("inventario").delete().eq("id",id);
  if(error)return toast("No se pudo eliminar");
  cerrar();toast("Eliminado");
  try{await cargarInv()}catch(e){}
}

/* ---------- Animación de botones ---------- */
const SEL="button:not(:disabled),.row,.card";
let P=null;
function ripple(el,x,y){
  const r=el.getBoundingClientRect(),s=document.createElement("span");
  s.className="rip";s.style.cssText=`left:${x-r.left}px;top:${y-r.top}px;--s:${(Math.max(r.width,r.height)*2.4/20).toFixed(1)}`;
  el.appendChild(s);setTimeout(()=>s.remove(),700);
}
function hundir(){
  if(!P||P.on)return;P.on=true;const el=P.el;
  el.classList.remove("tap","spring");el.classList.add("press","down");ripple(el,P.x,P.y);
}
function fin(el,cls){clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove(cls),720)}
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest&&e.target.closest(SEL);if(!el)return;
  clearTimeout(P&&P.t);
  P={el,x:e.clientX,y:e.clientY,on:false,t:setTimeout(hundir,140)};
},{passive:true});
document.addEventListener("pointerup",()=>{
  if(!P)return;clearTimeout(P.t);const {el,on,x,y}=P;P=null;
  if(on){el.classList.remove("down");void el.offsetWidth;el.classList.add("spring");fin(el,"spring")}
  else{el.classList.add("press");el.classList.remove("tap","spring");void el.offsetWidth;el.classList.add("tap");ripple(el,x,y);fin(el,"tap")}
});
document.addEventListener("pointercancel",()=>{if(!P)return;clearTimeout(P.t);if(P.on)P.el.classList.remove("down");P=null});

window.addEventListener("error",e=>toast("Error: "+e.message));
window.addEventListener("unhandledrejection",e=>toast("Error: "+((e.reason&&e.reason.message)||"desconocido")));
init();
</script>
