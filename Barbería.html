<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a2f20">
<title>Mono's · Caja</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<link rel="apple-touch-icon" href="favicon.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#1a2f20;
  --g2:#152618;
  --o:#d4bc72;
  --oh:#e8d7a0;
  --soft:rgba(212,188,114,.07);
  --line:rgba(212,188,114,.22);
  --line2:rgba(212,188,114,.12);
  --bad:#e9a79d;
  --good:#8fbc8f;
  --shadow:0 20px 50px rgba(0,0,0,.4);
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--g);color:var(--o);font-family:'Cormorant Garamond',serif;font-size:18px}
body{
  min-height:100vh;overflow-x:hidden;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  background:
    radial-gradient(ellipse 120% 80% at 50% -20%, rgba(212,188,114,.09), transparent 55%),
    radial-gradient(ellipse 80% 50% at 100% 50%, rgba(212,188,114,.04), transparent 50%),
    linear-gradient(180deg, var(--g) 0%, var(--g2) 100%);
}
.wrap{max-width:550px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 0}

/* Top bar */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{height:48px;width:auto;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.login .logo{height:128px;margin:0 auto 16px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.45))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:2.5px;font-size:1.15em;text-transform:uppercase}
.tools{display:flex;gap:10px}
button{font-family:inherit;color:var(--o);cursor:pointer}
.ico{
  background:rgba(212,188,114,.1);
  border:1px solid var(--line);
  border-radius:10px;width:44px;height:44px;font-size:1.25em;
  display:flex;align-items:center;justify-content:center;
  transition:transform .18s,background .2s,border-color .2s,box-shadow .2s;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.ico:active{transform:scale(.94)}
.spin{animation:sp .7s linear}
@keyframes sp{to{transform:rotate(360deg)}}

/* Cards & boxes */
.box{
  background:linear-gradient(165deg, rgba(255,255,255,.04) 0%, rgba(0,0,0,.15) 100%);
  border:1px solid var(--line2);
  border-radius:var(--radius);
  padding:22px 18px;margin-bottom:16px;
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(8px);
}
.hero{
  text-align:center;padding:28px 16px 24px;
  background:linear-gradient(165deg, rgba(212,188,114,.1) 0%, rgba(0,0,0,.2) 100%);
  border:1px solid rgba(212,188,114,.18);
  position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(212,188,114,.12), transparent 70%);
  pointer-events:none;
}
.hlab{font-size:1.05em;font-style:italic;opacity:.85;position:relative}
.nav{display:flex;align-items:center;justify-content:center;gap:16px;position:relative}
.nav button{background:none;border:0;font-size:1.9em;padding:4px 12px;opacity:.85;transition:opacity .15s,transform .15s}
.nav button:disabled{opacity:.18}
.nav button:not(:disabled):active{transform:scale(.9)}
.big{
  font-size:clamp(2.9em,15vw,4.8em);font-weight:700;line-height:1;
  margin:8px 0 16px;color:#fff;letter-spacing:1.5px;
  text-shadow:0 4px 24px rgba(0,0,0,.35);
  position:relative;
}
.pill{
  background:transparent;border:1.5px solid var(--o);border-radius:24px;
  padding:8px 18px;font-size:.9em;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;transition:all .2s;
  position:relative;
}
.pill.ok{background:var(--o);color:var(--g);box-shadow:0 4px 16px rgba(212,188,114,.35)}

/* Grid cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.card{
  background:linear-gradient(160deg, rgba(0,0,0,.22) 0%, rgba(0,0,0,.12) 100%);
  border:1px solid var(--line);
  border-radius:var(--radius);padding:16px 14px;
  transition:transform .18s,box-shadow .18s;position:relative;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.card small{display:block;font-style:italic;opacity:.75;margin-bottom:2px}
.card b{font-size:1.75em;color:#fff;letter-spacing:.5px}
.card .cp{
  position:absolute;top:8px;right:8px;background:none;border:0;
  font-size:1.05em;padding:6px;opacity:.7;transition:opacity .15s;
}
.card .cp:active{opacity:1}

/* Buttons */
.btn{
  background:linear-gradient(180deg, var(--oh) 0%, var(--o) 100%);
  color:var(--g);border:0;border-radius:10px;
  padding:17px;width:100%;font-size:1.28em;font-weight:700;
  letter-spacing:1.2px;text-transform:uppercase;
  box-shadow:0 5px 0 #9a8540, 0 12px 28px rgba(0,0,0,.35);
  transition:transform .12s,box-shadow .12s;margin-bottom:22px;
  position:relative;overflow:hidden;
}
.btn.sm{font-size:1.08em;padding:13px;margin:0}
.btn:disabled{opacity:.45}
.btn.ghost{
  background:transparent;color:var(--o);
  border:1.5px solid var(--o);box-shadow:none;
}
.btn.ghost:active{background:rgba(212,188,114,.1)}

/* Segments */
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{
  flex:1;background:rgba(0,0,0,.25);border:1px solid var(--line);
  border-radius:8px;padding:11px 4px;font-size:1em;font-weight:600;
  transition:all .18s;
}
.seg button.on{
  background:linear-gradient(180deg, var(--oh), var(--o));
  color:var(--g);border-color:var(--o);
  box-shadow:0 3px 12px rgba(212,188,114,.25);
}
.sum{font-style:italic;opacity:.8;font-size:.95em;margin:2px 2px 12px}

/* Rows */
.row{
  display:flex;justify-content:space-between;gap:12px;align-items:center;
  padding:14px 6px;border-bottom:1px solid var(--line2);
  cursor:pointer;transition:background .18s,transform .12s;
  border-radius:8px;margin:0 -6px;
}
.row:last-child{border:0}
.row:active{background:rgba(212,188,114,.06)}
.row b{font-size:1.12em}
.row small{display:block;opacity:.7;font-size:.88em;margin-top:2px}
.amt{text-align:right;font-weight:700;color:#fff;font-size:1.18em;white-space:nowrap}
.amt small{font-weight:400;color:var(--o)}
.tag{
  display:inline-block;border:1px solid var(--line);border-radius:12px;
  padding:1px 9px;font-size:.78em;margin-left:5px;letter-spacing:.3px;
}
.debt{color:var(--bad);border-color:var(--bad)}
.empty{text-align:center;opacity:.55;font-style:italic;padding:28px 0;font-size:1.05em}

/* Forms */
input,select{
  width:100%;background:rgba(0,0,0,.28);color:var(--o);
  border:1px solid rgba(212,188,114,.4);border-radius:9px;
  padding:15px 16px;font-family:inherit;font-size:1.12em;outline:none;
  margin-bottom:12px;-webkit-appearance:none;appearance:none;
  transition:border-color .2s,box-shadow .2s;
}
input:focus{border-color:var(--o);box-shadow:0 0 0 3px rgba(212,188,114,.15)}
input::placeholder{color:rgba(212,188,114,.4)}
input[type=date]{min-height:54px}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(75%) sepia(40%) saturate(400%) hue-rotate(5deg)}
label.l{display:block;font-style:italic;opacity:.8;font-size:.95em;margin:0 0 5px 3px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{
  background:rgba(0,0,0,.22);border:1px solid var(--line);
  border-radius:8px;padding:11px 14px;font-size:1em;
  transition:all .18s;
}
.chip.on{
  background:linear-gradient(180deg, var(--oh), var(--o));
  color:var(--g);font-weight:700;border-color:var(--o);
  box-shadow:0 3px 10px rgba(212,188,114,.3);
}

/* Slots */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 16px}
.slot{
  padding:15px 4px;text-align:center;line-height:1.15;
  background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:9px;
  transition:all .18s;
}
.slot small{display:block;font-size:.7em;opacity:.8;margin-top:4px}
.slot.booked{opacity:.4;border-style:dashed}
.slot.blk{border-color:var(--bad);color:var(--bad)}
.slot.blk.on{background:var(--bad);color:var(--g);border-color:var(--bad)}
.slot:not(.booked):not(.blk):active{background:rgba(212,188,114,.12)}
.dif{min-height:26px;text-align:center;font-style:italic;margin-bottom:10px;opacity:.9}

/* Tabs */
.tabs{
  position:fixed;left:0;right:0;bottom:0;display:flex;
  background:rgba(18,38,24,.94);border-top:1px solid var(--line);
  padding:9px 8px calc(9px + env(safe-area-inset-bottom));
  backdrop-filter:blur(16px);z-index:50;
  box-shadow:0 -8px 32px rgba(0,0,0,.35);
}
.tabs button{
  flex:1;background:none;border:0;border-radius:10px;
  padding:12px 0;font-size:1em;letter-spacing:.5px;opacity:.55;
  transition:all .2s;position:relative;
}
.tabs button.on{
  opacity:1;background:rgba(212,188,114,.14);font-weight:700;
  color:var(--oh);
}
.tabs button.on::after{
  content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:18px;height:3px;border-radius:2px;background:var(--o);
}

/* Views */
.view{display:none}
.view.on{display:block;animation:in .28s cubic-bezier(.2,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Overlay & sheet */
.ov{
  position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;
  display:none;align-items:flex-end;justify-content:center;
  animation:fd .22s;backdrop-filter:blur(4px);
}
.ov.on{display:flex}
@keyframes fd{from{opacity:0}to{opacity:1}}
.sheet{
  background:linear-gradient(180deg, #1f3828 0%, #16261c 100%);
  border:1px solid var(--line);border-bottom:0;
  border-radius:18px 18px 0 0;width:100%;max-width:550px;
  max-height:92vh;overflow-y:auto;
  padding:22px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .32s cubic-bezier(.2,.85,.3,1);
  box-shadow:0 -20px 60px rgba(0,0,0,.5);
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sh h3{margin:0;font-size:1.45em;text-transform:uppercase;letter-spacing:1.5px;font-weight:700}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.stats div{
  background:rgba(0,0,0,.25);border:1px solid var(--line);
  border-radius:9px;padding:12px 6px;text-align:center;
}
.stats b{display:block;color:#fff;font-size:1.22em}
.stats small{font-style:italic;opacity:.75;font-size:.85em}
.alert{
  border:1px solid var(--bad);color:var(--bad);border-radius:9px;
  padding:13px;margin-bottom:14px;text-align:center;background:rgba(233,167,157,.08);
}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom));
  transform:translate(-50%,16px);background:var(--o);color:var(--g);
  padding:12px 22px;border-radius:28px;font-weight:700;
  opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.2,.8,.3,1);
  z-index:300;box-shadow:0 8px 28px rgba(0,0,0,.35);letter-spacing:.3px;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{
  width:100%;max-width:420px;
  background:linear-gradient(165deg, rgba(255,255,255,.05) 0%, rgba(0,0,0,.2) 100%);
  border:1px solid rgba(212,188,114,.2);
  box-shadow:0 30px 80px rgba(0,0,0,.45);
}
.login h1{text-align:center;text-transform:uppercase;letter-spacing:4px;font-size:1.8em;margin:0 0 6px;font-weight:700}
.login p{text-align:center;font-style:italic;opacity:.7;margin:0 0 24px}
.rem{display:flex;gap:12px;align-items:center;margin:4px 0 20px;font-weight:600;cursor:pointer}
.rem input{
  width:26px;height:26px;margin:0;padding:0;flex-shrink:0;
  border:1.5px solid var(--o);border-radius:7px;background:rgba(0,0,0,.25);
  cursor:pointer;transition:all .15s;
}
.rem input:checked{
  background:var(--o) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5' fill='none' stroke='%231a2f20' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/75% no-repeat;
}
.rem small{display:block;font-weight:400;font-style:italic;opacity:.7;font-size:.85em;margin-top:2px}
.err{color:var(--bad);text-align:center;min-height:22px;margin-bottom:8px}
[hidden]{display:none!important}

/* Sub cifras */
.subs{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:6px;font-style:italic;font-size:.9em}
.hero .subs{justify-content:center;margin-top:18px}
.subs b{font-style:normal;font-weight:600;font-size:1em;color:#f5ecd8}
.subs span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.subs span::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid rgba(245,236,216,.65)}
.subs .pr,.subs .pr b{color:var(--o)}
.subs .pr::before{background:var(--o);border-color:var(--o)}

/* Inventario */
.inv{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2)}
.inv:last-child{border:0}
.inf{flex:1;min-width:0;background:none;border:0;text-align:left;padding:6px 4px;border-radius:8px;font-size:1em}
.inf b{display:block;font-size:1.12em}
.inf small{display:block;opacity:.7;font-size:.88em;margin-top:2px}
.stk{display:flex;align-items:center;gap:4px}
.mini{
  width:44px;height:44px;border-radius:50%;
  background:rgba(212,188,114,.1);border:1px solid var(--line);
  font-size:1.5em;line-height:1;padding:0;
  transition:transform .12s,background .15s;
}
.mini:active{transform:scale(.9)}
.n{min-width:42px;text-align:center;font-weight:700;color:#fff;font-size:1.4em}
.inv.low .n{color:var(--bad)}
.bdg{
  position:absolute;top:2px;right:calc(50% - 40px);
  min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--bad);color:var(--g);font-style:normal;font-weight:700;
  font-size:.72em;line-height:18px;text-align:center;
}

/* Press / ripple animations */
.press{position:relative;overflow:hidden;--sy:4px;--ss:.955;--so:1.018;transition:transform .16s cubic-bezier(.3,.7,.4,1),box-shadow .16s,filter .16s,background .2s,opacity .2s,color .15s,border-color .15s}
.row,.card,.inf{--sy:2px;--ss:.975;--so:1.006}
.btn{--ss:.975;--so:1.012}
.press.down{transform:translateY(var(--sy)) scale(var(--ss));filter:brightness(.92)}
.press.tap{animation:tap .66s ease-in-out}
.press.spring{animation:spring .66s ease-in-out}
@keyframes tap{0%{transform:none}16%{transform:translateY(var(--sy)) scale(var(--ss))}48%{transform:translateY(-1.5px) scale(var(--so))}70%{transform:translateY(.5px) scale(.997)}100%{transform:none}}
@keyframes spring{0%{transform:translateY(var(--sy)) scale(var(--ss))}40%{transform:translateY(-1.5px) scale(var(--so))}68%{transform:translateY(.5px) scale(.997)}100%{transform:none}}
.btn.down{box-shadow:0 1px 0 #9a8540,0 3px 6px rgba(0,0,0,.35)}
.btn.tap{animation-name:btnTap}.btn.spring{animation-name:btnSpring}
.btn.ghost.down{box-shadow:none}.btn.ghost.tap{animation-name:tap}.btn.ghost.spring{animation-name:spring}
@keyframes btnTap{0%{transform:none;box-shadow:0 5px 0 #9a8540,0 12px 28px rgba(0,0,0,.35)}16%{transform:translateY(4px) scale(.975);box-shadow:0 1px 0 #9a8540,0 3px 6px rgba(0,0,0,.35)}48%{transform:translateY(-2px) scale(1.012);box-shadow:0 7px 0 #9a8540,0 14px 24px rgba(0,0,0,.35)}70%{transform:translateY(.5px) scale(.997);box-shadow:0 4.5px 0 #9a8540,0 10px 20px rgba(0,0,0,.35)}100%{transform:none;box-shadow:0 5px 0 #9a8540,0 12px 28px rgba(0,0,0,.35)}}
@keyframes btnSpring{0%{transform:translateY(4px) scale(.975);box-shadow:0 1px 0 #9a8540,0 3px 6px rgba(0,0,0,.35)}40%{transform:translateY(-2px) scale(1.012);box-shadow:0 7px 0 #9a8540,0 14px 24px rgba(0,0,0,.35)}68%{transform:translateY(.5px) scale(.997);box-shadow:0 4.5px 0 #9a8540,0 10px 20px rgba(0,0,0,.35)}100%{transform:none;box-shadow:0 5px 0 #9a8540,0 12px 28px rgba(0,0,0,.35)}}
.rip{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle,rgba(255,246,214,.5),rgba(255,246,214,0) 70%);transform:scale(0);pointer-events:none;animation:rip .66s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rip{0%{transform:scale(0);opacity:1}100%{transform:scale(var(--s,12));opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="loginV" class="login" hidden>
  <div class="box">
    <img class="logo" src="logo.png" alt="Mono's" onerror="this.style.display='none'"><p>Caja y turnos</p>
    <input id="lEm" type="email" placeholder="Correo" autocomplete="username">
    <input id="lPw" type="password" placeholder="Contraseña" autocomplete="current-password">
    <label class="rem"><input type="checkbox" id="lRem" checked><span>Mantener sesión iniciada<small id="lHint"></small></span></label>
    <div class="err" id="lErr"></div>
    <button class="btn" style="margin:0" id="lBtn" onclick="login()">Entrar</button>
  </div>
</div>

<div id="app" hidden>
<div class="wrap">
  <div class="top">
    <div class="brand"><img class="logo" src="logo.png" alt="Mono's" onerror="this.style.display='none'"></div>
    <div class="tools">
      <button class="ico" id="rf" onclick="recargar(true)" aria-label="Actualizar"><span id="rfi" style="display:inline-block">&#8635;</span></button>
      <button class="ico" onclick="salir()" aria-label="Cerrar sesión">&#10162;</button>
    </div>
  </div>

  <section class="view on" id="v-caja">
    <div class="box hero">
      <div class="nav">
        <button onclick="moverDia(-1)" aria-label="Día anterior">&#8249;</button>
        <div class="hlab" id="hLab"></div>
        <button id="nx" onclick="moverDia(1)" aria-label="Día siguiente">&#8250;</button>
      </div>
      <div class="big" id="hBig">$0</div>
      <button class="pill" onclick="copiar(S.vd,this)">Copiar</button>
      <div class="subs" id="hSub"></div>
    </div>
    <div class="grid2">
      <div class="card"><button class="cp" onclick="copiar(S.vw,this)" aria-label="Copiar semana">&#10064;</button><small>Semana</small><b id="cW">$0</b><div class="subs" id="cW0"></div></div>
      <div class="card"><button class="cp" onclick="copiar(S.vm,this)" aria-label="Copiar mes">&#10064;</button><small>Mes</small><b id="cM">$0</b><div class="subs" id="cM0"></div></div>
    </div>
    <button class="btn" onclick="later(abrirIngreso)">+ Ingresar ganancia</button>
    <div class="box">
      <div class="seg" id="perSeg">
        <button data-p="dia" class="on">Día</button><button data-p="sem">Semana</button><button data-p="mes">Mes</button>
      </div>
      <div class="sum" id="perSum"></div>
      <div id="lista"></div>
    </div>
  </section>

  <section class="view" id="v-cli">
    <div class="box">
      <input id="cBus" type="text" placeholder="Buscar cliente" oninput="pintaCli()">
      <div class="seg" id="cliSeg"><button data-f="todos" class="on">Todos</button><button data-f="deben">Deben turno</button></div>
      <div id="cliLista"></div>
    </div>
  </section>

  <section class="view" id="v-inv">
    <div id="invAlert"></div>
    <button class="btn" onclick="later(()=>editInv())">+ Añadir producto</button>
    <div class="box"><div id="invLista"></div></div>
  </section>

  <section class="view" id="v-blq">
    <div class="box">
      <label class="l">Día</label>
      <input type="date" id="bFec" onchange="S.bdia=this.value;cargarBloq()">
      <div id="bMsg"></div>
      <div class="slots" id="slots"></div>

async function traerTodo(){

  if(error)throw error;return data||[];
}
function construir(rows){
  const m=new Map();
  rows.forEach(r=>{
    const k=r.reserva_id||("id:"+r.id);
    let g=m.get(k);
    if(!g){g={k,id:r.id,fecha:r.fecha,nombre:r.nombre,tel:r.telefono,serv:r.servicios,esp:0,cob:null,prop:0,desc:0,ns:false,nsc:false,rid:r.reserva_id,extra:false};m.set(k,g)}
    if(r.precio_cobrado!=null)g.cob=Math.max(g.cob??0,+r.precio_cobrado);
    g.esp=Math.max(g.esp,+(r.precio_esperado??r.total??0));
    g.prop=Math.max(g.prop,+(r.propina||0));g.desc=Math.max(g.desc,+(r.descuento||0));
    if(r.no_show)g.ns=true;if(r.no_show_cobrado)g.nsc=true;
    if(/^Extra /.test(r.turno||""))g.extra=true;
    if(r.fecha<g.fecha)g.fecha=r.fecha;
  });
  const res=[...m.values()];
  res.forEach(g=>{
    g.key=keyCli(g.tel,g.nombre);
    if(g.cob!=null){
      const base=g.esp>0?Math.max(g.esp-g.desc,0):null;
      const incl=base==null?g.prop:Math.max(g.cob-base,0);
      g.prop=Math.max(g.prop,incl);
      g.con=base==null?g.cob:g.cob+Math.max(g.prop-incl,0);
      g.sin=Math.max(g.con-g.prop,0);
    }
  });
  return res;
}

}

      const t=$$("#iSrv .chip.on").reduce((x,c)=>x+num(c.dataset.p),0);$("#iEsp").value=t||"";if(!F.dirty)$("#iCob").value=t||"";difer()};

function autoTel(){const n=$("#iNom").value.trim().toLowerCase();const c=[...S.cli.values()].find(c=>(c.nombre||"").toLowerCase()===n);if(c&&c.tel&&!$("#iTel").value)$("#iTel").value=c.tel}
function calc(){
  const e=num($("#iEsp").value),c=num($("#iCob").value),raw=$("#iPro").value.trim();
  const p=raw!==""?Math.max(num(raw),0):(e&&c>e?c-e:0);
  const d=e?Math.max(e-(c-p),0):0;
  return {e,c,p,d};
}
function difer(){
  const {c,p,d}=calc();
  $("#iDif").textContent=!c?"":[p?"Propina: "+fmt(p):"",d?"Descuento: "+fmt(d):""].filter(Boolean).join(" · ")||"Sin propina ni descuento";

async function cargarBloq(){
  const f=S.bdia||hoy();
  const {data}=await sb.from("bloqueos").select("id,fecha,hora,todo_el_dia").eq("fecha",f);
  const set=new Set((data||[]).map(b=>b.todo_el_dia?"ALL":b.hora));
  const all=set.has("ALL");
  $("#slots").innerHTML=SLOTS.map(h=>{
    const booked=all||set.has(h);
    return `<button type="button" class="slot ${booked?"booked blk":""}" data-h="${h}" ${booked?"":'onclick="toggleSlot(this)"'}>${h}${booked?"<small>bloqueado</small>":""}</button>`;
  }).join("");
  $("#bMsg").innerHTML=all?'<div class="alert" style="margin:0 0 12px">Día completo bloqueado</div>':"";
  const {data:prox}=await sb.from("bloqueos").select("fecha,hora,todo_el_dia").gte("fecha",hoy()).order("fecha").limit(20);
  const agrup={};
  (prox||[]).forEach(b=>{
    if(!agrup[b.fecha])agrup[b.fecha]=[];
    agrup[b.fecha].push(b.todo_el_dia?"Todo el día":b.hora);
  });
  $("#bProx").innerHTML=Object.keys(agrup).length?Object.entries(agrup).map(([f,hs])=>`<div class="row" style="cursor:default"><div><b>${bonita(f)}</b><small>${hs.join(" · ")}</small></div></div>`).join(""):'<div class="empty">No hay bloqueos próximos</div>';
}
function toggleSlot(el){el.classList.toggle("on")}
async function bloquear(todo){
  const f=S.bdia||hoy();
  if(todo){
    const {error}=await sb.from("bloqueos").upsert({fecha:f,hora:null,todo_el_dia:true},{onConflict:"fecha,hora"});
    if(error)return toast("No se pudo bloquear");
    toast("Día bloqueado");
  }else{
    const sel=$$("#slots .slot.on:not(.booked)");
    if(!sel.length)return toast("Elige al menos un horario");
    for(const el of sel){
      await sb.from("bloqueos").upsert({fecha:f,hora:el.dataset.h,todo_el_dia:false},{onConflict:"fecha,hora"});
    }
    toast("Horarios bloqueados");
  }
  cargarBloq();
}
async function liberar(){
  const f=S.bdia||hoy();

}

  $("#invLista").innerHTML=items.length?items.map(i=>`<div class="inv ${i.stock<=(i.minimo??0)?"low":""}" data-id="${i.id}">
    <button class="inf" onclick="editInv(${i.id})"><b>${esc(i.nombre)}</b><small>${i.unidad||"uds"} · mín. ${i.minimo??0}</small></button>
    <div class="stk"><button class="mini" onclick="chgStk(${i.id},-1)">−</button><span class="n">${i.stock}</span><button class="mini" onclick="chgStk(${i.id},1)">+</button></div>
  </div>`).join(""):'<div class="empty">Sin productos todavía</div>';
}
async function chgStk(id,d){
  const {data}=await sb.from("inventario").select("stock").eq("id",id).single();
  if(!data)return;
  const n=Math.max(0,(data.stock||0)+d);
  await sb.from("inventario").update({stock:n}).eq("id",id);
  cargarInv();
}
function editInv(id){
  const item=id?null:null;
  abrir(`<div class="sh"><h3>${id?"Editar producto":"Nuevo producto"}</h3><button class="ico" onclick="cerrar()">&#10005;</button></div>
  <label class="l">Nombre</label><input id="ivNom" placeholder="Ej. Cera mate" value="">
  <label class="l">Stock actual</label><input id="ivStk" type="number" inputmode="numeric" placeholder="0" value="0">
  <label class="l">Mínimo (alerta)</label><input id="ivMin" type="number" inputmode="numeric" placeholder="0" value="2">
  <label class="l">Unidad</label><input id="ivUni" placeholder="uds / botellas..." value="uds">
  <button class="btn" style="margin:0" id="ivOk" onclick="guardarInv(${id||"null"})">Guardar</button>
  ${id?`<button class="btn ghost sm" style="margin-top:14px" onclick="borrarInv(${id})">Eliminar producto</button>`:""}`);
  if(id){
    sb.from("inventario").select("*").eq("id",id).single().then(({data})=>{
      if(!data)return;
      $("#ivNom").value=data.nombre||"";
      $("#ivStk").value=data.stock??0;
      $("#ivMin").value=data.minimo??2;
      $("#ivUni").value=data.unidad||"uds";
    });
  }
}
async function guardarInv(id){
  const nombre=$("#ivNom").value.trim(),stock=num($("#ivStk").value),minimo=num($("#ivMin").value),unidad=$("#ivUni").value.trim()||"uds";
  if(!nombre)return toast("Escribe el nombre");
  const b=$("#ivOk");b.disabled=true;b.textContent="Guardando...";
  let error;
  if(id)({error}=await sb.from("inventario").update({nombre,stock,minimo,unidad}).eq("id",id));
  else ({error}=await sb.from("inventario").insert({nombre,stock,minimo,unidad}));
  b.disabled=false;b.textContent="Guardar";
  if(error)return toast("No se pudo guardar");
  cerrar();toast("Guardado");cargarInv();
}
async function borrarInv(id){
  if(!confirm("¿Eliminar este producto?"))return;
  const {error}=await sb.from("inventario").delete().eq("id",id);
  if(error)return toast("No se pudo eliminar");
  cerrar();toast("Eliminado");cargarInv();
}

/* ---------- EDITAR COBRO ---------- */
function editCobro(k){
  const g=S.cobros.find(x=>x.k===k);if(!g)return toast("No se encontró el cobro");
  S.ek=k;S.ekey=g.key;

  // Concepto actual de un ingreso extra (quita el prefijo "Extra: ")
  const conceptoExtra = g.extra && g.serv
    ? (g.serv.startsWith("Extra: ") ? g.serv.slice(7) : g.serv)
    : "";

  if(g.extra){
    // Formulario completo para ingresos extra
    abrir(`<div class="sh"><h3>Editar ingreso extra</h3><button class="ico" onclick="cerrar()">&#10005;</button></div>
    <label class="l">Concepto</label>
    <input id="eCon" placeholder="Ej. venta de producto, propina suelta..." value="${esc(conceptoExtra)}" maxlength="60">
    <label class="l">Fecha</label>
    <input id="eFec" type="date" value="${g.fecha}" max="${hoy()}">
    <label class="l">Precio esperado</label>
    <input id="iEsp" type="number" inputmode="decimal" placeholder="0" value="${g.esp>0?nn(g.esp):""}" oninput="difer()">
    <label class="l">Cobrado (total, propina incluida)</label>
    <input id="iCob" type="number" inputmode="decimal" placeholder="0" value="${nn(g.con)}" oninput="difer()">
    <label class="l">Propina (si la dejas vacía, se calcula)</label>
    <input id="iPro" type="number" inputmode="decimal" placeholder="auto" value="${g.prop>0?nn(g.prop):""}" oninput="difer()">
    <div class="dif" id="iDif"></div>
    <button class="btn" style="margin-bottom:0" id="eOk" onclick="guardarEdit()">Guardar cambios</button>
    <button class="btn ghost sm" style="margin-top:14px" onclick="borrarCobro()">Eliminar ingreso extra</button>`);
  } else {
    // Formulario normal (solo montos) para cobros de corte
    abrir(`<div class="sh"><h3>Editar cobro</h3><button class="ico" onclick="cerrar()">&#10005;</button></div>
    <div class="sum" style="margin-bottom:12px">${esc(g.nombre||"Sin nombre")} · ${bonita(g.fecha)}${g.serv?" · "+esc(g.serv):""}</div>
    <label class="l">Precio esperado</label><input id="iEsp" type="number" inputmode="decimal" placeholder="0" value="${g.esp>0?nn(g.esp):""}" oninput="difer()">
    <label class="l">Cobrado (total, propina incluida)</label><input id="iCob" type="number" inputmode="decimal" placeholder="0" value="${nn(g.con)}" oninput="difer()">
    <label class="l">Propina (si la dejas vacía, se calcula)</label><input id="iPro" type="number" inputmode="decimal" placeholder="auto" value="${g.prop>0?nn(g.prop):""}" oninput="difer()">
    <div class="dif" id="iDif"></div>
    <button class="btn" style="margin-bottom:0" id="eOk" onclick="guardarEdit()">Guardar cambios</button>
    ${S.cli.has(g.key)?`<button class="btn ghost sm" style="margin-top:14px" onclick="ficha(S.ekey)">Ver ficha del cliente</button>`:""}`);
  }
  difer();
}

async function guardarEdit(){
  const g=S.cobros.find(x=>x.k===S.ek);if(!g)return;
  const cob=num($("#iCob").value);
  if(!(cob>0))return toast("Escribe cuánto cobraste");
  const esp=num($("#iEsp").value)||cob,raw=$("#iPro").value.trim();
  const pro=raw!==""?Math.max(num(raw),0):(cob>esp?cob-esp:0);
  const desc=Math.max(esp-(cob-pro),0);

  const patch={precio_esperado:esp,precio_cobrado:cob,propina:pro,descuento:desc};

  // Si es ingreso extra, también actualizamos concepto y fecha
  if(g.extra){
    const con=($("#eCon")?.value||"").trim();
    const fec=$("#eFec")?.value;
    if(!fec)return toast("Elige la fecha");
    patch.servicios="Extra: "+(con||"ingreso");
    patch.fecha=fec;
    // nombre se mantiene como "Ingreso extra"
  }

  const b=$("#eOk");b.disabled=true;b.textContent="Guardando...";
  const q=sb.from("turnos").update(patch);
  const {data,error}=await (g.rid?q.eq("reserva_id",g.rid).not("precio_cobrado","is",null):q.eq("id",g.id)).select("id");
  b.disabled=false;b.textContent="Guardar cambios";
  if(error||!data||!data.length)return toast("No se pudo guardar el cambio");
  cerrar();toast("Cobro corregido");
  S.dia = (g.extra && patch.fecha) ? (patch.fecha<=hoy()?patch.fecha:S.dia) : (g.fecha<=hoy()?g.fecha:S.dia);
  await recargar();
}

async function borrarCobro(){
  const g=S.cobros.find(x=>x.k===S.ek);if(!g||!g.extra)return;
  if(!confirm("¿Eliminar este ingreso extra de "+fmt(g.con)+"? No se puede deshacer."))return;
  const q=sb.from("turnos").delete().like("turno","Extra%");
  const {data,error}=await (g.rid?q.eq("reserva_id",g.rid):q.eq("id",g.id)).select("id");
  if(error||!data||!data.length)return toast("No se pudo eliminar");
  cerrar();toast("Ingreso eliminado");await recargar();
}

$("#lista").onclick=e=>{const r=e.target.closest(".row[data-k]");if(r){const k=r.dataset.k;later(()=>editCobro(k))}};
$("#sheet").onclick=e=>{const r=e.target.closest(".row[data-k]");if(r){const k=r.dataset.k;later(()=>editCobro(k))}};

/* ---------- Tabs ---------- */
$$(".tabs button").forEach(b=>b.onclick=()=>{
  $$(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+b.dataset.v));
  if(b.dataset.v==="blq")cargarBloq();
});

/* ---------- Animación de botones ---------- */
const SEL="button:not(:disabled),.row,.card";
let P=null;
function ripple(el,x,y){
  const r=el.getBoundingClientRect(),s=document.createElement("span");
  s.className="rip";s.style.cssText=`left:${x-r.left}px;top:${y-r.top}px;--s:${(Math.max(r.width,r.height)*2.4/20).toFixed(1)}`;
  el.appendChild(s);setTimeout(()=>s.remove(),700);
}
function hundir(){
  if(!P||P.on)return;P.on=true;const el=P.el;
  el.classList.remove("tap","spring");el.classList.add("press","down");ripple(el,P.x,P.y);
}
function fin(el,cls){clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove(cls),720)}
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest&&e.target.closest(SEL);if(!el)return;
  clearTimeout(P&&P.t);
  P={el,x:e.clientX,y:e.clientY,on:false,t:setTimeout(hundir,140)};
},{passive:true});
document.addEventListener("pointerup",()=>{
  if(!P)return;clearTimeout(P.t);const {el,on,x,y}=P;P=null;
  if(on){el.classList.remove("down");void el.offsetWidth;el.classList.add("spring");fin(el,"spring")}
  else{el.classList.add("press");el.classList.remove("tap","spring");void el.offsetWidth;el.classList.add("tap");ripple(el,x,y);fin(el,"tap")}
});
document.addEventListener("pointercancel",()=>{if(!P)return;clearTimeout(P.t);if(P.on)P.el.classList.remove("down");P=null});

window.addEventListener("error",e=>toast("Error: "+e.message));
window.addEventListener("unhandledrejection",e=>toast("Error: "+((e.reason&&e.reason.message)||"desconocido")));
init();
</script>
